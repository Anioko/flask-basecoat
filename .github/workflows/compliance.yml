name: shadcn compliance

on:
  push:
  pull_request:

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          # Flask-RQ2 (demo app) still imports pkg_resources, which setuptools stopped shipping in version 81.
          pip install "setuptools<81"
          pip install -r requirements.txt -r requirements-dev.txt
          pip install playwright axe-playwright-python lxml cssselect pytest
          python -m playwright install --with-deps chromium
      - name: Install Node toolchains
        run: |
          npm ci
          cd compliance/golden && npm ci
          # The pinned upstream sources under compliance/upstream import react, recharts and the rest; they resolve
          # them from compliance/node_modules, which is the golden renderer's install.
          cd .. && ln -s golden/node_modules node_modules
      - name: Render the upstream golden pages and build stylesheets
        run: |
          python compliance/scripts/gen_theme.py
          npm run golden
          npm run build
          python scripts/build_js.py
      - name: Generated artefacts are committed
        run: |
          python compliance/scripts/extract_recipes.py > /dev/null
          python scripts/gen_macros.py --force > /dev/null
          git diff --quiet -- compliance/recipes flask_basecoat/data flask_basecoat/templates/basecoat/*.html compliance/golden/out \n            || { python compliance/scripts/first_difference.py compliance/recipes flask_basecoat/data flask_basecoat/templates/basecoat compliance/golden/out; exit 1; }
      - name: Render the chart goldens in this browser
        # Recharts measures label text to thin axis ticks, so the chart goldens are drawn with this runner's fonts,
        # the same fonts the checks draw our charts with.
        run: cd compliance/golden && npm run charts
      - name: Compliance checks
        run: python scripts/shadcn_compliance.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: compliance/REPORT.json
