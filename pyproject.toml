[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Flask-Basecoat"
version = "1.0.0"
description = "The shadcn/ui design system as Jinja macros for Flask: every registry component and block, checked against the pinned upstream sources"
readme = "README.md"
authors = [{ name = "Anioko" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "WTForms>=3.0.0",
    "Flask-WTF>=1.2.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "playwright>=1.40.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flask_basecoat*"]

[tool.setuptools.package-data]
flask_basecoat = ["templates/**/*.html", "static/**/*", "data/*.json"]
