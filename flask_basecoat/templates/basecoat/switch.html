{# shadcn switch macro - exact class parity with shadcn/ui switch.tsx #}
{% macro switch(name='', checked=false, disabled=false, class='', id='') %}
<button
    type="button"
    role="switch"
    aria-checked="{{ 'true' if checked else 'false' }}"
    data-state="{{ 'checked' if checked else 'unchecked' }}"
    data-slot="switch"
    class="peer data-[state=checked]:bg-primary data-[state=unchecked]:bg-input focus-visible:border-ring focus-visible:ring-ring/50 dark:data-[state=unchecked]:bg-input/80 inline-flex h-[1.15rem] w-8 shrink-0 items-center rounded-full border border-transparent shadow-xs transition-all outline-none focus-visible:ring-[3px] disabled:cursor-not-allowed disabled:opacity-50 {{ class }}"
    {%- if disabled %} disabled{% endif %}
    {%- if id %} id="{{ id }}"{% endif %}
    {%- if name %} name="{{ name }}"{% endif %}
>
    <span
        data-slot="switch-thumb"
        data-state="{{ 'checked' if checked else 'unchecked' }}"
        class="bg-background dark:data-[state=unchecked]:bg-foreground dark:data-[state=checked]:bg-primary-foreground pointer-events-none block size-4 rounded-full ring-0 transition-transform data-[state=checked]:translate-x-[calc(100%-2px)] data-[state=unchecked]:translate-x-0"
    ></span>
</button>
{%- endmacro -%}
