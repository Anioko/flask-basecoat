{# shadcn radio-group macros - exact class parity with shadcn/ui radio-group.tsx #}

{% macro radio_group(content='', class='') %}
<div
    role="radiogroup"
    data-slot="radio-group"
    class="grid gap-3 {{ class }}"
>
    {{- content|safe -}}
</div>
{%- endmacro -%}

{% macro radio_group_item(value='', name='', checked=false, class='', id='') %}
<button
    type="button"
    role="radio"
    aria-checked="{{ 'true' if checked else 'false' }}"
    data-state="{{ 'checked' if checked else 'unchecked' }}"
    data-slot="radio-group-item"
    value="{{ value }}"
    class="border-input text-primary focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:bg-input/30 aspect-square size-4 shrink-0 rounded-full border shadow-xs transition-[color,box-shadow] outline-none focus-visible:ring-[3px] disabled:cursor-not-allowed disabled:opacity-50 {{ class }}"
    {%- if id %} id="{{ id }}"{% endif %}
    {%- if name %} name="{{ name }}"{% endif %}
>
    <span data-slot="radio-group-indicator" class="relative flex items-center justify-center">
        {%- if checked %}
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fill-primary absolute top-1/2 left-1/2 size-2 -translate-x-1/2 -translate-y-1/2"><circle cx="12" cy="12" r="10"/></svg>
        {%- endif %}
    </span>
</button>
{%- endmacro -%}
