{# shadcn checkbox macro - exact class parity with shadcn/ui checkbox.tsx #}
{% macro checkbox(name='', checked=false, disabled=false, class='', id='') %}
<button
    type="button"
    role="checkbox"
    aria-checked="{{ 'true' if checked else 'false' }}"
    data-state="{{ 'checked' if checked else 'unchecked' }}"
    data-slot="checkbox"
    class="peer border-input dark:bg-input/30 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground dark:data-[state=checked]:bg-primary data-[state=checked]:border-primary focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive size-4 shrink-0 rounded-[4px] border shadow-xs transition-shadow outline-none focus-visible:ring-[3px] disabled:cursor-not-allowed disabled:opacity-50 {{ class }}"
    {%- if disabled %} disabled{% endif %}
    {%- if id %} id="{{ id }}"{% endif %}
    {%- if name %} name="{{ name }}"{% endif %}
>
    {%- if checked %}
    <span data-slot="checkbox-indicator" class="flex items-center justify-center text-current transition-none">
        <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    {%- endif %}
</button>
{%- endmacro -%}
