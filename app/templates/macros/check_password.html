{% macro password_check(field, level) %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.2.0/zxcvbn.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var submitBtn = document.getElementById('submit');
  if(submitBtn) submitBtn.disabled = true;
  var fld = document.getElementById('{{ field }}');
  if(fld){
    var meterEl = document.createElement('progress');
    meterEl.setAttribute('value','0');
    meterEl.setAttribute('max','4');
    meterEl.id = 'password-strength-meter';
    var textEl = document.createElement('p');
    textEl.id = 'password-strength-text';
    fld.insertAdjacentElement('afterend', textEl);
    fld.insertAdjacentElement('afterend', meterEl);
  } else {
    if(submitBtn) submitBtn.disabled = false;
  }

  var strength = {
    0: "Bad",
    1: "Okay",
    2: "Good",
    3: "Very Good",
    4: "Strong"
  };

  var meter = document.getElementById('password-strength-meter');
  var text = document.getElementById('password-strength-text');

  if(fld){
    fld.addEventListener('input', function(e){
      var v = fld.value || '';
      var result = zxcvbn(v);
      if(meter) meter.value = result.score;
      if(submitBtn) submitBtn.disabled = !(result.score >= {{ level }});
      if(text){
        if (v !== "") text.innerHTML = "Strength: " + strength[result.score];
        else text.innerHTML = "";
      }
    });
  }
});
</script>
<style>
  progress {
    /* Reset the default appearance */
    -webkit-appearance: none;
       -moz-appearance: none;
            appearance: none;

    margin: 10 auto 1em;
    width: 100%;
    height: 0.5em;
    background-color: rgba(0, 0, 0, 0.1);
  }

  /* Chrome */
  progress::-webkit-progress-value {
    background: rgba(0, 0, 0, 0.1); 
  }

   /* Webkit based browsers */
  progress[value^="1"]::-webkit-progress-value { background-color: red; }
  progress[value^="2"]::-webkit-progress-value { background-color: yellow; }
  progress[value^="3"]::-webkit-progress-value { background-color: orange; }
  progress[value^="4"]::-webkit-progress-value { background-color: green; }


  /* Gecko based browsers */
  progress[value^="1"]::-moz-progress-bar { background-color: red; }
  progress[value^="2"]::-moz-progress-bar { background-color: yellow; }
  progress[value^="3"]::-moz-progress-bar { background-color: orange; }
  progress[value^="4"]::-moz-progress-bar { background-color: green; }
</style>

{% endmacro %}
