<div class="container mx-auto prose">
    <div class="flashes">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{% if category == 'error' %}alert-destructive{% else %}alert{% endif %} flash-message message relative z-40">
                        <div class="flex items-start justify-between">
                            <h2 class="flex-1">{{ message }}</h2>
                            <button class="close ml-4 text-2xl leading-none opacity-50 hover:opacity-100 shrink-0" aria-label="Close">&times;</button>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('[data-autohide]').forEach(function(el){
    var sec = el.getAttribute('data-autohide');
    var close = el.querySelector('.close-btn');
    var remove = function(){ if(el && el.parentNode) el.parentNode.removeChild(el); };
    if(close) close.addEventListener('click', remove);
    if(sec) el._t = setTimeout(remove, Number(sec) * 1000);
  });
});
</script>
